{% extends 'base.html' %}

{% block title %}Incoming orders - Jesus Latin Grill{% endblock %}

{% block content %}
<div class="container-fluid staff-orders mt-3 mb-5">

    <div class="d-flex align-items-baseline justify-content-between mb-3">
        <h1 class="h3 mb-0">Incoming orders</h1>
        <span id="connection" class="staff-connection">Updating automatically</span>
    </div>

    <div class="row g-3">
        <section class="col-lg-4 staff-lane" data-status="new">
            <h2>New <span class="staff-count"></span></h2>
            <div class="staff-list"></div>
        </section>
        <section class="col-lg-4 staff-lane" data-status="preparing">
            <h2>Preparing <span class="staff-count"></span></h2>
            <div class="staff-list"></div>
        </section>
        <section class="col-lg-4 staff-lane" data-status="ready">
            <h2>Ready for pickup <span class="staff-count"></span></h2>
            <div class="staff-list"></div>
        </section>
    </div>
</div>

<div id="staff-toast" class="staff-toast" role="status" aria-live="polite"></div>

<script>
(function () {
    const URLS = {
        data: "{% url 'staff_orders_data' %}",
        status: id => "{% url 'staff_update_order_status' 0 %}".replace("/0/", "/" + id + "/"),
        login: "{% url 'login' %}?next={{ request.path|urlencode }}",
    };
    const CSRF_TOKEN = "{{ csrf_token }}";
    const REFRESH_MS = 5000;

    // Buttons shown on a ticket in each column: [new status, button label]
    const ACTIONS = {
        new:       [["preparing", "Start"], ["cancelled", "Cancel"]],
        preparing: [["ready", "Mark ready"], ["cancelled", "Cancel"]],
        ready:     [["completed", "Picked up"]],
    };
    const EMPTY_TEXT = {
        new: "No new orders. They'll show up here as customers check out.",
        preparing: "Nothing being prepared.",
        ready: "Nothing waiting for pickup.",
    };

    const seenIds = new Set();
    let firstLoad = true;

    const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c =>
        ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

    const minutesSince = iso => Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000));
    const ageClass = mins => mins >= 20 ? "late" : mins >= 10 ? "warn" : "";

    function ticketHtml(order, isNew) {
        const mins = minutesSince(order.created_at);
        const items = order.items.map(i =>
            `<li><b>${i.qty}</b> ${escapeHtml(i.name)}</li>`).join("");
        const buttons = (ACTIONS[order.status] || []).map(([status, label]) =>
            `<button type="button" class="btn staff-btn staff-btn-${status}"
                     data-id="${order.id}" data-status="${status}">${label}</button>`).join("");
        return `
            <article class="staff-ticket${isNew ? " is-new" : ""}">
                <div class="d-flex justify-content-between align-items-baseline">
                    <span class="staff-num">#${order.id}</span>
                    <span class="staff-age ${ageClass(mins)}" data-created="${order.created_at}">${mins} min</span>
                </div>
                <div class="staff-who">${escapeHtml(order.customer_name)} &middot; ${escapeHtml(order.customer_phone)}</div>
                <ul class="staff-items">${items}</ul>
                ${order.notes ? `<div class="staff-note">${escapeHtml(order.notes)}</div>` : ""}
                <div class="d-flex gap-2">${buttons}</div>
            </article>`;
    }

    function render(orders) {
        let arrivals = 0;
        document.querySelectorAll(".staff-lane").forEach(lane => {
            const status = lane.dataset.status;
            const inLane = orders.filter(o => o.status === status);
            lane.querySelector(".staff-count").textContent = inLane.length || "";
            lane.querySelector(".staff-list").innerHTML = inLane.length
                ? inLane.map(o => {
                    const isNew = !firstLoad && !seenIds.has(o.id);
                    if (isNew) arrivals++;
                    return ticketHtml(o, isNew);
                }).join("")
                : `<p class="staff-empty">${EMPTY_TEXT[status]}</p>`;
        });
        orders.forEach(o => seenIds.add(o.id));
        if (arrivals) chime();
        firstLoad = false;
    }

    async function load() {
        const connection = document.getElementById("connection");
        try {
            const res = await fetch(URLS.data, {headers: {"Accept": "application/json"}});
            if (res.status === 401) { window.location.href = URLS.login; return; }
            render(await res.json());
            connection.textContent = "Updating automatically";
            connection.classList.remove("is-offline");
        } catch (err) {
            connection.textContent = "Connection lost. Retrying…";
            connection.classList.add("is-offline");
        }
    }

    async function changeStatus(button) {
        const id = button.dataset.id;
        if (button.dataset.status === "cancelled" && !window.confirm(`Cancel order #${id}?`)) return;
        button.disabled = true;
        try {
            const res = await fetch(URLS.status(id), {
                method: "POST",
                headers: {"Content-Type": "application/json", "X-CSRFToken": CSRF_TOKEN},
                body: JSON.stringify({status: button.dataset.status}),
            });
            if (!res.ok) {
                const body = await res.json().catch(() => ({}));
                showToast(body.error || `Order #${id} couldn't be updated. Try again.`);
            }
        } catch (err) {
            showToast(`Order #${id} couldn't be updated. Check the connection and try again.`);
        }
        load();
    }

    document.addEventListener("click", e => {
        const button = e.target.closest(".staff-btn");
        if (button) changeStatus(button);
    });

    function showToast(message) {
        const toast = document.getElementById("staff-toast");
        toast.textContent = message;
        toast.classList.add("is-visible");
        setTimeout(() => toast.classList.remove("is-visible"), 3500);
    }

    // Short beep when a new order arrives (the browser needs one click on the page first).
    function chime() {
        try {
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            osc.frequency.value = 880;
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        } catch (err) {}
    }

    // Keep the "x min" timers current between refreshes.
    setInterval(() => {
        document.querySelectorAll(".staff-age").forEach(el => {
            const mins = minutesSince(el.dataset.created);
            el.textContent = `${mins} min`;
            el.className = `staff-age ${ageClass(mins)}`;
        });
    }, 30000);

    load();
    setInterval(load, REFRESH_MS);
})();
</script>
{% endblock %}
